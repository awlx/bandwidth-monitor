name: bandwidth-monitor
arch: "${GOARCH}"
platform: linux
version: "${VERSION}"
maintainer: "Annika Wickert <awlx@users.noreply.github.com>"
description: "Real-time network monitoring dashboard with embedded web UI"
vendor: "awlx"
homepage: "https://github.com/awlx/bandwidth-monitor"
license: "AGPL-3.0-only"

contents:
  - src: ./bandwidth-monitor
    dst: /usr/bin/bandwidth-monitor
    file_info:
      mode: 0755

  - src: ./bandwidth-top
    dst: /usr/bin/bandwidth-top
    file_info:
      mode: 0755

  - src: ./env.example
    dst: /usr/share/bandwidth-monitor/env.example
    file_info:
      mode: 0644

  - src: ./packaging/bandwidth-monitor.service
    dst: /lib/systemd/system/bandwidth-monitor.service
    file_info:
      mode: 0644

  - src: ./packaging/bandwidth-monitor.openrc
    dst: /etc/init.d/bandwidth-monitor
    file_info:
      mode: 0755

scripts:
  preinstall: ./packaging/preinstall.sh
  postinstall: ./packaging/postinstall.sh
  preremove: ./packaging/preremove.sh
  postremove: ./packaging/postremove.sh
