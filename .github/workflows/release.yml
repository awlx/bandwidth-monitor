name: Build & Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GO_VERSION: '1.25.7'

jobs:
  # ─── Linux deb/rpm (amd64 + arm64) ────────────────────────────────
  linux-packages:
    strategy:
      matrix:
        include:
          - goarch: amd64
            pkg_arch: amd64
          - goarch: arm64
            pkg_arch: arm64

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Calculate package version
        run: |
          VERSION="$(./packaging/package-version.sh nfpm \
            "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA")"
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate packaging
        if: matrix.goarch == 'amd64'
        run: ./packaging/test-packaging.sh

      - name: Test Linux packages
        if: matrix.goarch == 'amd64'
        run: |
          go vet ./...
          go test ./...
          go test -race -v ./bandwidthtop ./cmd/bandwidth-top ./talkers

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          COMMIT="$(echo $GITHUB_SHA | cut -c1-7)"
          LDFLAGS="-s -w -X bandwidth-monitor/version.Commit=${COMMIT} -X bandwidth-monitor/version.Version=${PACKAGE_VERSION}"
          go build -ldflags="${LDFLAGS}" -o bandwidth-monitor .
          go build -ldflags="${LDFLAGS}" -o bandwidth-top ./cmd/bandwidth-top

      - name: Build deb
        env:
          VERSION: ${{ env.PACKAGE_VERSION }}
          GOARCH: ${{ matrix.pkg_arch }}
        run: |
          export VERSION="${VERSION#v}"
          nfpm package -p deb -f nfpm.yaml
          nfpm package -p deb -f nfpm-top.yaml

      - name: Test deb install and upgrade
        if: matrix.goarch == 'amd64'
        run: |
          package="$(find . -maxdepth 1 -name 'bandwidth-monitor_*.deb' -print -quit)"
          test -n "$package"

          # Reproduce minimal systems that intentionally omit package docs.
          echo 'path-exclude=/usr/share/doc/*' |
            sudo tee /etc/dpkg/dpkg.cfg.d/99-bandwidth-monitor-test >/dev/null

          sudo env DEBIAN_FRONTEND=noninteractive dpkg -i "$package"
          test -f /etc/bandwidth-monitor/env
          test -f /usr/share/bandwidth-monitor/env.example
          test ! -e /usr/bin/bandwidth-top
          test "$(stat -c '%a' /etc/bandwidth-monitor/env)" = "600"
          ! dpkg-query -W -f='${Conffiles}\n' bandwidth-monitor |
            grep -q '/etc/bandwidth-monitor/env'
          verify="$(dpkg -V bandwidth-monitor)"
          test -z "$verify"

          sudo sh -c "printf '\n# locally-managed-setting\n' >> /etc/bandwidth-monitor/env"
          before="$(sudo sha256sum /etc/bandwidth-monitor/env | awk '{print $1}')"
          sudo env DEBIAN_FRONTEND=noninteractive dpkg -i "$package"
          after="$(sudo sha256sum /etc/bandwidth-monitor/env | awk '{print $1}')"
          test "$before" = "$after"
          ! dpkg-query -W -f='${Conffiles}\n' bandwidth-monitor |
            grep -q '/etc/bandwidth-monitor/env'
          verify="$(dpkg -V bandwidth-monitor)"
          test -z "$verify"

      - name: Test bandwidth-top deb payload and install
        if: matrix.goarch == 'amd64'
        run: |
          package="$(find . -maxdepth 1 -name 'bandwidth-top_*.deb' -print -quit)"
          test -n "$package"
          dpkg-deb --contents "$package" |
            awk '$1 ~ /^[-l]/ {print $NF}' | sort > /tmp/bandwidth-top-files
          test "$(cat /tmp/bandwidth-top-files)" = "./usr/bin/bandwidth-top"
          control_dir="$(mktemp -d)"
          dpkg-deb --control "$package" "$control_dir"
          test ! -e "$control_dir/preinst"
          test ! -e "$control_dir/postinst"
          test ! -e "$control_dir/prerm"
          test ! -e "$control_dir/postrm"
          test ! -e "$control_dir/conffiles"
          sudo env DEBIAN_FRONTEND=noninteractive dpkg -i "$package"
          test -x /usr/bin/bandwidth-top
          test "$(dpkg-query -L bandwidth-top | grep -c '^/usr/bin/bandwidth-top$')" = "1"
          ! dpkg-query -L bandwidth-top |
            grep -Eq '^/etc/|^/lib/systemd/|^/usr/share/bandwidth-monitor/|^/var/'
          test -z "$(dpkg-query -W -f='${Depends}\n' bandwidth-top)"
          test -z "$(dpkg -V bandwidth-top)"

      - name: Build rpm
        env:
          VERSION: ${{ env.PACKAGE_VERSION }}
          GOARCH: ${{ matrix.pkg_arch }}
        run: |
          export VERSION="${VERSION#v}"
          nfpm package -p rpm -f nfpm.yaml
          nfpm package -p rpm -f nfpm-top.yaml

      - name: Build Arch Linux packages
        env:
          VERSION: ${{ env.PACKAGE_VERSION }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          export VERSION="${VERSION#v}"
          nfpm package -p archlinux -f nfpm-arch.yaml
          nfpm package -p archlinux -f nfpm-top-arch.yaml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.goarch }}
          path: |
            *.deb
            *.rpm
            *.pkg.tar.zst

  # ─── OpenWrt (multiple targets) ────────────────────────────────────
  openwrt:
    strategy:
      matrix:
        include:
          # ── OpenWrt 23.05 (stable, ipk) ──
          - arch: x86_64
            goarch: amd64
            pkg_format: ipk
          - arch: aarch64_generic
            goarch: arm64
            pkg_format: ipk
          - arch: mips_24kc
            goarch: mips
            gomips: softfloat
            pkg_format: ipk
          - arch: mipsel_24kc
            goarch: mipsle
            gomips: softfloat
            pkg_format: ipk
          - arch: aarch64_cortex-a53
            goarch: arm64
            pkg_format: ipk
          - arch: arm_cortex-a7_neon-vfpv4
            goarch: arm
            goarm: "7"
            pkg_format: ipk
          # ── OpenWrt SNAPSHOT (nightly, apk) ──
          - arch: x86_64-snapshot
            goarch: amd64
            pkg_format: apk
          - arch: aarch64_generic-snapshot
            goarch: arm64
            pkg_format: apk
          - arch: aarch64_cortex-a53-snapshot
            goarch: arm64
            pkg_format: apk
          - arch: arm_cortex-a7_neon-vfpv4-snapshot
            goarch: arm
            goarm: "7"
            pkg_format: apk

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          GOARM: ${{ matrix.goarm }}
        run: |
          COMMIT="$(echo $GITHUB_SHA | cut -c1-7)"
          VERSION="$(./packaging/package-version.sh openwrt \
            "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA")"
          LDFLAGS="-s -w -X bandwidth-monitor/version.Commit=${COMMIT} -X bandwidth-monitor/version.Version=${VERSION}"
          go build -ldflags="${LDFLAGS}" -o bandwidth-monitor .
          go build -ldflags="${LDFLAGS}" -o bandwidth-top ./cmd/bandwidth-top
          file bandwidth-monitor
          file bandwidth-top
          echo "BINARY=${{ github.workspace }}/bandwidth-monitor" >> $GITHUB_ENV
          echo "TOP_BINARY=${{ github.workspace }}/bandwidth-top" >> $GITHUB_ENV

      - name: Package for OpenWrt
        run: |
          VERSION="$(./packaging/package-version.sh openwrt \
            "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA")"
          ARCH="${{ matrix.arch }}"
          ARCH="${ARCH%-snapshot}"
          WORKSPACE="${{ github.workspace }}"
          PKG_FORMAT="${{ matrix.pkg_format }}"

          PKG_DIR=$(mktemp -d)
          BUILD_DIR=$(mktemp -d)
          TOP_PKG_DIR=$(mktemp -d)
          TOP_BUILD_DIR=$(mktemp -d)
          mkdir -p "$PKG_DIR/usr/bin"
          mkdir -p "$PKG_DIR/etc/bandwidth-monitor"
          mkdir -p "$PKG_DIR/etc/init.d"
          mkdir -p "$TOP_PKG_DIR/usr/bin"
          mkdir -p "$WORKSPACE/pkg-out"

          cp "$BINARY" "$PKG_DIR/usr/bin/bandwidth-monitor"
          cp "$TOP_BINARY" "$TOP_PKG_DIR/usr/bin/bandwidth-top"
          cp "$WORKSPACE/env.example" "$PKG_DIR/etc/bandwidth-monitor/env"
          cp "$WORKSPACE/packaging/openwrt-files/bandwidth-monitor.init" "$PKG_DIR/etc/init.d/bandwidth-monitor"
          chmod 755 "$PKG_DIR/usr/bin/bandwidth-monitor" "$PKG_DIR/etc/init.d/bandwidth-monitor"
          chmod 755 "$TOP_PKG_DIR/usr/bin/bandwidth-top"
          chmod 600 "$PKG_DIR/etc/bandwidth-monitor/env"
          test ! -e "$PKG_DIR/usr/bin/bandwidth-top"
          test "$(find "$TOP_PKG_DIR" -type f -print)" = "$TOP_PKG_DIR/usr/bin/bandwidth-top"

          if [ "$PKG_FORMAT" = "apk" ]; then
            # Download apk-tools v3 static binary for creating APK v3 packages
            wget -q "https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/x86_64/APKINDEX.tar.gz" -O /tmp/APKINDEX.tar.gz
            APK_STATIC_VER=$(tar xzf /tmp/APKINDEX.tar.gz -O APKINDEX 2>/dev/null | awk '/^P:apk-tools-static$/{found=1} found && /^V:/{print $0; exit}' | cut -d: -f2)
            echo "Latest apk-tools-static version: $APK_STATIC_VER"
            wget -q "https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/x86_64/apk-tools-static-${APK_STATIC_VER}.apk" -O /tmp/apk-static.apk
            cd /tmp && tar xzf apk-static.apk sbin/apk.static && cd "$WORKSPACE"
            APK=/tmp/sbin/apk.static

            BUILDDATE=$(date +%s)

            APK_FILE="$WORKSPACE/pkg-out/bandwidth-monitor-${VERSION}-r1_${ARCH}.apk"
            cd "$PKG_DIR"
            $APK mkpkg \
              -I "name:bandwidth-monitor" \
              -I "version:${VERSION}-r1" \
              -I "description:Real-time network monitoring dashboard with embedded web UI" \
              -I "url:https://github.com/awlx/bandwidth-monitor" \
              -I "build-time:${BUILDDATE}" \
              -I "arch:${ARCH}" \
              -I "license:AGPL-3.0-only" \
              -I "maintainer:Annika Wickert <awlx@users.noreply.github.com>" \
              -F "$PKG_DIR" \
              -o "$APK_FILE"
            ls -lh "$APK_FILE"
            file "$APK_FILE"

            TOP_APK_FILE="$WORKSPACE/pkg-out/bandwidth-top-${VERSION}-r1_${ARCH}.apk"
            $APK mkpkg \
              -I "name:bandwidth-top" \
              -I "version:${VERSION}-r1" \
              -I "description:Ad-hoc live terminal network traffic viewer" \
              -I "url:https://github.com/awlx/bandwidth-monitor" \
              -I "build-time:${BUILDDATE}" \
              -I "arch:${ARCH}" \
              -I "license:AGPL-3.0-only" \
              -I "maintainer:Annika Wickert <awlx@users.noreply.github.com>" \
              -F "$TOP_PKG_DIR" \
              -o "$TOP_APK_FILE"
            ls -lh "$TOP_APK_FILE"
            file "$TOP_APK_FILE"
          else
            mkdir -p "$PKG_DIR/CONTROL"
            printf '%s\n' \
              "Package: bandwidth-monitor" \
              "Version: ${VERSION}" \
              "Architecture: ${ARCH}" \
              "Maintainer: Annika Wickert <awlx@users.noreply.github.com>" \
              "Section: net" \
              "Description: Real-time network monitoring dashboard with embedded web UI" \
              > "$PKG_DIR/CONTROL/control"

            echo "/etc/bandwidth-monitor/env" > "$PKG_DIR/CONTROL/conffiles"

            tar czf "$BUILD_DIR/control.tar.gz" -C "$PKG_DIR/CONTROL" .
            tar czf "$BUILD_DIR/data.tar.gz" --owner=0 --group=0 -C "$PKG_DIR" usr etc
            echo "2.0" > "$BUILD_DIR/debian-binary"

            IPK_FILE="$WORKSPACE/pkg-out/bandwidth-monitor_${VERSION}_${ARCH}.ipk"
            cd "$BUILD_DIR"
            # OpenWrt ipk is a tar.gz containing debian-binary, control.tar.gz, data.tar.gz
            tar czf "$IPK_FILE" --owner=0 --group=0 ./debian-binary ./control.tar.gz ./data.tar.gz
            file "$IPK_FILE"

            mkdir -p "$TOP_PKG_DIR/CONTROL"
            printf '%s\n' \
              "Package: bandwidth-top" \
              "Version: ${VERSION}" \
              "Architecture: ${ARCH}" \
              "Maintainer: Annika Wickert <awlx@users.noreply.github.com>" \
              "Section: net" \
              "Description: Ad-hoc live terminal network traffic viewer" \
              > "$TOP_PKG_DIR/CONTROL/control"

            tar czf "$TOP_BUILD_DIR/control.tar.gz" -C "$TOP_PKG_DIR/CONTROL" .
            tar czf "$TOP_BUILD_DIR/data.tar.gz" --owner=0 --group=0 -C "$TOP_PKG_DIR" usr
            echo "2.0" > "$TOP_BUILD_DIR/debian-binary"

            TOP_IPK_FILE="$WORKSPACE/pkg-out/bandwidth-top_${VERSION}_${ARCH}.ipk"
            cd "$TOP_BUILD_DIR"
            tar czf "$TOP_IPK_FILE" --owner=0 --group=0 ./debian-binary ./control.tar.gz ./data.tar.gz
            file "$TOP_IPK_FILE"
          fi

      - name: Upload OpenWrt package
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.arch }}
          path: pkg-out/*

  # ─── macOS standalone bandwidth-top (amd64 + arm64) ────────────────
  darwin-top:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            goarch: amd64
          - runner: macos-15
            goarch: arm64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test standalone macOS CLI
        run: |
          go vet ./bandwidthtop ./packets ./talkers ./cmd/bandwidth-top
          go test ./bandwidthtop ./packets ./talkers ./cmd/bandwidth-top
          go test -race ./bandwidthtop ./packets ./talkers ./cmd/bandwidth-top

      - name: Build standalone macOS binary
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="$(./packaging/package-version.sh nfpm \
            "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA")"
          COMMIT="$(echo "$GITHUB_SHA" | cut -c1-7)"
          LDFLAGS="-s -w -X bandwidth-monitor/version.Commit=${COMMIT} -X bandwidth-monitor/version.Version=${VERSION}"
          ARCHIVE="bandwidth-top_${VERSION}_darwin_${GOARCH}.tar.gz"
          echo "DARWIN_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          mkdir -p darwin-top
          go build -trimpath -ldflags="${LDFLAGS}" -o darwin-top/bandwidth-top ./cmd/bandwidth-top

      - name: Sign and notarize standalone macOS binary
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: ./packaging/sign-and-notarize-darwin.sh darwin-top/bandwidth-top

      - name: Create standalone macOS archive
        run: |
          ./packaging/create-darwin-top-archive.sh \
            darwin-top/bandwidth-top LICENSE "$DARWIN_ARCHIVE"
          shasum -a 256 "$DARWIN_ARCHIVE" > "${DARWIN_ARCHIVE}.sha256"

      - name: Upload standalone macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: bandwidth-top-darwin-${{ matrix.goarch }}
          path: |
            bandwidth-top_*_darwin_${{ matrix.goarch }}.tar.gz
            bandwidth-top_*_darwin_${{ matrix.goarch }}.tar.gz.sha256

  # ─── GitHub Release (tags only) ────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-packages, openwrt, darwin-top]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.pkg.tar.zst
            artifacts/**/*.ipk
            artifacts/**/*.apk
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # ─── Required aggregate release build check ────────────────────────
  release-checks:
    if: always() && !startsWith(github.ref, 'refs/tags/v')
    needs: [linux-packages, openwrt, darwin-top]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release build matrix
        env:
          DARWIN_TOP_RESULT: ${{ needs.darwin-top.result }}
          LINUX_PACKAGES_RESULT: ${{ needs.linux-packages.result }}
          OPENWRT_RESULT: ${{ needs.openwrt.result }}
        run: |
          test "$DARWIN_TOP_RESULT" = "success"
          test "$LINUX_PACKAGES_RESULT" = "success"
          test "$OPENWRT_RESULT" = "success"

  # ─── Package Repositories (GitHub Pages) ────────────────────────────
  # Builds APT and pacman repositories and deploys them together.
  apt-repo:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    concurrency:
      group: package-repositories
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format long 2>/dev/null | awk '/^sec/{print $2}' | cut -d/ -f2 | head -1)
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> $GITHUB_ENV

      - name: Build APT repository
        run: |
          mkdir -p repo/pool/main repo/dists/stable/main/binary-amd64 repo/dists/stable/main/binary-arm64

          # Collect all .deb files into pool
          find artifacts -name '*.deb' -exec cp {} repo/pool/main/ \;
          echo "Packages in pool:"
          ls -lh repo/pool/main/

          # Generate Packages indices
          cd repo
          for arch in amd64 arm64; do
            dpkg-scanpackages --arch "$arch" pool/ > "dists/stable/main/binary-${arch}/Packages"
            gzip -k "dists/stable/main/binary-${arch}/Packages"
          done

          # Generate Release file
          cat > dists/stable/Release << RELEASE
          Origin: bandwidth-monitor
          Label: bandwidth-monitor
          Suite: stable
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: Bandwidth Monitor APT Repository
          RELEASE

          # Add checksums
          cd dists/stable
          apt-ftparchive release . >> Release

          # GPG sign
          gpg --batch --yes --default-key "$GPG_KEY_ID" -abs -o Release.gpg Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release

          cd "$GITHUB_WORKSPACE/repo"

          # Export public key for users
          gpg --armor --export "$GPG_KEY_ID" > bandwidth-monitor.gpg.key

      - name: Build pacman repository
        run: |
          ./packaging/create-pacman-repository.sh artifacts repo/arch "$GPG_KEY_ID"
          install -m 0755 packaging/install-arch-repo.sh repo/install-arch-repo.sh
          install -m 0644 packaging/package-repository-index.html repo/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          force_orphan: true
