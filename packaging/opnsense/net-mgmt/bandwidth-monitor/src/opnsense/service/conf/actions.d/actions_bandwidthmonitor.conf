[start]
command: /usr/local/etc/rc.d/bandwidth_monitor start
parameters:
type: script
message: Starting bandwidth-monitor

[stop]
command: /usr/local/etc/rc.d/bandwidth_monitor stop
parameters:
type: script
message: Stopping bandwidth-monitor

[restart]
command: /usr/local/etc/rc.d/bandwidth_monitor restart
parameters:
type: script
message: Restarting bandwidth-monitor

[status]
command: /usr/local/etc/rc.d/bandwidth_monitor status; exit 0
parameters:
type: script_output
message: Requesting bandwidth-monitor status
